<svg width="800px" height="800px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Mask to carve out transparent audio waveform slots from the book -->
  <defs>
    <mask id="book-audio-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <!-- 1. White reveals the dark grey book -->
      <rect width="24" height="24" fill="#ffffff" />
      
      <!-- 2. Black strokes carve full transparency through the book -->
      <g stroke="#000000" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M  7.0 11.10 V 13.10" />
        <path d="M  9.5  9.60 V 14.60" />
        <path d="M 12.0  8.40 V 15.80" />
        <path d="M 14.5  9.60 V 14.60" />
        <path d="M 17.0 11.10 V 13.10" />
      </g>
    </mask>
  </defs>

  <!-- Dark Grey Book (#202020) with transparent waveform cutouts -->
  <path fill="#151515"
        mask="url(#book-audio-mask)"
        fill-rule="evenodd"
        clip-rule="evenodd"
        d="M 12.0 6.2
           C 13.8 5.4 16.8 4.7 18.8 5.3
           C 19.5 5.5 20.0 6.1 20.0 6.8
           V 16.6
           C 20.0 17.3 19.5 17.9 18.8 17.7
           C 16.8 17.1 14.2 17.6 12.8 18.4
           C 12.3 18.7 11.7 18.7 11.2 18.4
           C  9.8 17.6  7.2 17.1  5.2 17.7
           C  4.5 17.9  4.0 17.3  4.0 16.6
           V 6.8
           C  4.0 6.1  4.5 5.5  5.2 5.3
           C  7.2 4.7 10.2 5.4 12.0 6.2
           Z" />
</svg>

